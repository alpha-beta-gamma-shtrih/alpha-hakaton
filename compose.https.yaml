# Server only: docker compose -f compose.yaml -f compose.https.yaml up -d frontend
services:
  frontend:
    networks:
      - default
      - apps_subnet
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=apps_subnet"
      - "traefik.http.routers.credit-cabinet.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN to the site domain}`)"
      - "traefik.http.routers.credit-cabinet.entrypoints=https"
      - "traefik.http.routers.credit-cabinet.tls=true"
      - "traefik.http.routers.credit-cabinet.tls.certresolver=myresolver"
      - "traefik.http.routers.credit-cabinet.service=credit-cabinet"
      - "traefik.http.services.credit-cabinet.loadbalancer.server.port=80"

networks:
  apps_subnet:
    external: true
