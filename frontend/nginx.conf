server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_read_timeout 130s;
    }

    location /health/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location = /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location = /docs/oauth2-redirect {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
