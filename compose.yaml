name: credit-cabinet

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the external database}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:8080","http://localhost:8000"]}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CSRF_SIGNING_KEY: ${CSRF_SIGNING_KEY:?Set CSRF_SIGNING_KEY in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEMO_DATASET_DIR: ${DEMO_DATASET_DIR:-/app/demo_data/demo_0_3}
  DOCUMENTS_DIR: /app/.data/documents
  LLM_ENABLED: ${LLM_ENABLED:-true}
  LLM_BASE_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
  LLM_MAX_PARALLEL: ${LLM_MAX_PARALLEL:-1}
  CLIENT_SESSION_ABSOLUTE_TTL_SECONDS: ${CLIENT_SESSION_ABSOLUTE_TTL_SECONDS:-28800}
  CLIENT_SESSION_IDLE_TTL_SECONDS: ${CLIENT_SESSION_IDLE_TTL_SECONDS:-3600}
  BANK_SESSION_ABSOLUTE_TTL_SECONDS: ${BANK_SESSION_ABSOLUTE_TTL_SECONDS:-14400}
  BANK_SESSION_IDLE_TTL_SECONDS: ${BANK_SESSION_IDLE_TTL_SECONDS:-900}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
  LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-300}

services:
  ollama:
    image: ollama/ollama:0.40.5
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [CMD-SHELL, "OLLAMA_HOST=http://127.0.0.1:11434 ollama list > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:0.40.5
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [pull, "${LLM_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy

  postgres-test:
    profiles: 
      - test
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: credit_test
      POSTGRES_PASSWORD: isolated-test-password
      POSTGRES_DB: credit_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U credit_test -d credit_test]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    profiles: 
      - test
    image: credit-cabinet-app:local
    command: [python, -m, pytest, -q, -p, "no:cacheprovider"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://credit_test:isolated-test-password@postgres-test:5432/credit_test
      LLM_ENABLED: "false"
    depends_on:
      postgres-test:
        condition: service_healthy

  init:
    image: credit-cabinet-app:local
    environment:
      <<: *backend-environment
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    command: [sh, -ec, 'alembic upgrade head && python -m credit_cabinet.seed --dataset "$${DEMO_DATASET_DIR}"']

  backend:
    image: credit-cabinet-app:local
    environment: *backend-environment
    volumes:
      - documents-data:/app/.data/documents
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    depends_on:
      init:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: credit-cabinet-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  documents-data:
  ollama-data:
