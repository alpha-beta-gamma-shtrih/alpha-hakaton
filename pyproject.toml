[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "credit-cabinet"
version = "0.1.0"
description = "Backend умного кредитного кабинета, demo-0.2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=25.1,<26",
  "itsdangerous>=2.2,<3",
  "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "httpx2>=2.15.1,<3",
]

[project.scripts]
credit-cabinet = "credit_cabinet.__main__:main"
credit-cabinet-user = "credit_cabinet.cli:create_user"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_cabinet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["I001"]
