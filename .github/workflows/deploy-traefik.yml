name: Deploy traefik

on: workflow_dispatch

jobs:
  deployment:
    name: Deploy traefik
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
    steps:
      - uses: actions/checkout@v3

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: just-a-placeholder-so-we-dont-get-errors

      - name: Adding Known Hosts
        run: ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Makedir
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p traefik/letsencrypt"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'docker network inspect apps_subnet >/dev/null 2>&1 || docker network create apps_subnet'

      - name: Deploy docker-compose file
        run: scp -P "$SSH_PORT" ./traefik/compose.yaml "$SSH_USER@$SSH_HOST:~/traefik/"

      - name: Start docker-compose
        run: >
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"
          "ACME_EMAIL=$(printf '%q' "$ACME_EMAIL")
          docker compose -f traefik/compose.yaml up --force-recreate -d"

      - name: Prune unused images
        run: ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" docker image prune -f
